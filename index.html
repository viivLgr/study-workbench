<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在打开学习工作台...</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; background:#f5f7fa; color:#1a202c;
}
.box { text-align:center; padding:40px 20px; }
.spinner {
  width:44px; height:44px;
  border:4px solid #e2e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
p { font-size:16px; margin-bottom:8px; }
.hint { font-size:14px; color:#718096; margin-top:12px; }
a { color:#2563eb; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p>正在打开学习工作台...</p>
  <p class="hint">如果没有自动跳转，<a href="工作台.html">点这里</a></p>
</div>
<script>
window.location.href = "工作台.html";
</script>
</body>
</html>
